# Checks the manuals still work against the latest Ghidra release:
#  - Ghidra hasn't started referencing manuals that aren't in config.json
#  - every manual can be downloaded and matches its pinned sha256
#  - the installed manuals' pages line up with Ghidra's .idx files
#  - every release asset is up and matches its pinned sha256 (backup URLs
#    that stopped working are only warnings, since some hosts block CI runners)
# Scheduled runs open (or comment on) an issue when something fails.

name: Check manuals

on:
  schedule:
    - cron: "23 6 * * 1"  # Mondays
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ghidra-manuals and poppler
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          pip install .

      - name: Download latest Ghidra
        id: ghidra
        run: |
          release=$(gh api repos/NationalSecurityAgency/ghidra/releases/latest)
          url=$(jq -r '[.assets[] | select(.name | endswith(".zip"))][0].browser_download_url' <<< "$release")
          echo "tag=$(jq -r .tag_name <<< "$release")" >> "$GITHUB_OUTPUT"
          curl -sSfL -o ghidra.zip "$url"
          # Only the manuals folders are needed
          unzip -q ghidra.zip '*/Ghidra/Processors/*/data/manuals/*' -d ghidra
          echo "path=$(ls -d "$PWD"/ghidra/*/)" >> "$GITHUB_OUTPUT"

      - name: Check for new manuals
        if: ${{ !cancelled() && steps.ghidra.outcome == 'success' }}
        run: |
          cp src/ghidra_manuals/config.json "$RUNNER_TEMP/config.json"
          ghidra-manuals "${{ steps.ghidra.outputs.path }}" --get-manual-idxs --config "$RUNNER_TEMP/config.json"
          if ! cmp -s src/ghidra_manuals/config.json "$RUNNER_TEMP/config.json"; then
            echo "::error::Ghidra ${{ steps.ghidra.outputs.tag }} references manuals that aren't in config.json"
            exit 1
          fi

      - name: Install manuals
        if: ${{ !cancelled() && steps.ghidra.outcome == 'success' }}
        run: ghidra-manuals "${{ steps.ghidra.outputs.path }}"

      - name: Verify pages
        if: ${{ !cancelled() && steps.ghidra.outcome == 'success' }}
        # HCS12: no public copy of S12XCPUV2 found. mipsMic: upstream .idx indexes microMIPS against the MIPS64 manual
        run: python tools/verify_pages.py "${{ steps.ghidra.outputs.path }}" --expect-fail HCS12.idx --expect-fail mipsMic.idx

      - name: Check URLs
        if: ${{ !cancelled() }}
        run: python tools/check_urls.py

      - name: Report failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        run: |
          title="Scheduled manual check failed"
          body="The [scheduled manual check](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed against Ghidra ${{ steps.ghidra.outputs.tag || '(unknown)' }}."
          issue=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" -R "${{ github.repository }}" --body "$body"
          else
            gh issue create -R "${{ github.repository }}" --title "$title" --body "$body"
          fi
